apply plugin: 'com.android.library'
android {
    namespace 'wei.mark.standout'
    compileSdk 34
    defaultConfig {
        minSdk 14
        targetSdk 34
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    
    }
    productFlavors {
    }
}

dependencies {
    implementation 'com.android.support:support-v4:23.0.1'
}

