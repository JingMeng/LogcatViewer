apply plugin: 'com.android.application'

android {
    namespace 'com.fatangare.logcatviewer.example'
    namespace 'com.fatangare.logcatlogger.example'
    compileSdk 34
    defaultConfig {
        applicationId "com.fatangare.logcatlogger.example"
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    sourceSets { main { java.exclude '**/*.java' } }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
    productFlavors {
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    implementation 'com.android.support:appcompat-v7:23.2.1'
    implementation project(':logcatviewer')
}




