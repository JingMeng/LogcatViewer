apply plugin: 'com.android.library'
android {
    namespace 'com.fatangare.logcatviewer'
    compileSdk 34

    defaultConfig {
        minSdk 14
        targetSdk 34
    }
    sourceSets { main { java.exclude '**/*.java' } }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    
    }
}
dependencies {
    implementation project(':standOut')
}




